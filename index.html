*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--page-bg);overscroll-behavior-y:none;}

.sync-pill.pending .dot{background:var(--warn);}
.sync-pill.offline .dot{background:var(--neutral-dim);}
.main{flex:1;padding:16px 16px 110px;}
.card{background:var(--secondary-light);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;}

h1.page-title{font-size:20px;font-weight:700;margin:2px 0 16px;}
label.lbl{display:block;font-size:12px;color:var(--neutral-dim);margin-bottom:5px;font-weight:600;}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],select,textarea{

.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;}
.row2>div{min-width:0;}
input[type=date],input[type=time]{min-width:0;max-width:100%;display:block;}
.seg{display:flex;gap:6px;margin-bottom:14px;background:var(--secondary);border:1px solid var(--line);border-radius:12px;padding:4px;}

.seg button.active{background:var(--primary);color:#fff;}
.hint{font-size:12px;color:var(--neutral-dim);margin:-6px 0 14px;line-height:1.45;}
.btn{font-family:inherit;font-size:15px;font-weight:700;border-radius:11px;padding:13px 16px;border:none;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn:disabled{opacity:.5;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-secondary{background:transparent;border:1.5px solid var(--neutral-dim);color:var(--neutral);}
.btn-danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger);}

.bottom-nav button{flex:1;background:none;border:none;color:var(--neutral-dim);font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 0;cursor:pointer;position:relative;}
.bottom-nav button.active{color:var(--primary-text);}
.nav-dot,.tab-dot{min-width:18px;height:18px;border-radius:9px;background:#D62828;color:#fff;font:800 11px Inter,Arial,sans-serif;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}

.tabs button.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.subbar{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px;font-size:12px;color:var(--neutral-dim);}
.linkish{background:none;border:none;color:var(--primary-text);font:600 13px Inter,sans-serif;cursor:pointer;padding:6px 0;}
.group-h{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--neutral-dim);margin:16px 2px 8px;display:flex;justify-content:space-between;}

.group-h:first-child{margin-top:4px;}

.chore.paused{opacity:.6;}
.tick{flex:none;width:32px;height:32px;border-radius:50%;border:2.5px solid var(--neutral-dim);background:transparent;color:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}

.chore-main{flex:1;min-width:0;cursor:pointer;}
.chore-title{font-size:15px;font-weight:600;line-height:1.3;}

.effort{letter-spacing:1px;color:var(--pink);}
.att-card{border-left:4px solid #D62828;}
.att-sum{font-size:14px;font-weight:600;margin-bottom:6px;}
.att-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);}

.banner{background:rgba(109,91,208,0.15);border:1px solid rgba(109,91,208,0.4);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45;margin-bottom:12px;}
.empty{text-align:center;padding:40px 20px;color:var(--neutral-dim);font-size:14px;line-height:1.5;}
.done-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
.done-row:first-child{border-top:none;}
.done-row .t{flex:1;min-width:0;font-size:14px;font-weight:600;}
.done-row .t span{display:block;font-size:12px;color:var(--neutral-dim);font-weight:500;margin-top:2px;}
.done-row .t.skipped{color:var(--neutral-dim);text-decoration:line-through;}
.small-btn{flex:none;background:transparent;border:1.5px solid var(--line);color:var(--neutral-dim);font:600 12px Inter,sans-serif;border-radius:9px;padding:7px 10px;cursor:pointer;}
.hidden-note{font-size:13px;color:var(--neutral-dim);text-align:center;padding:10px;}
.fair-row{margin-bottom:16px;}
.fair-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.fair-top .n{flex:1;font-weight:700;font-size:16px;}
.fair-top .v{font-size:13px;color:var(--neutral-dim);}
.bar{height:14px;border-radius:7px;background:var(--secondary);overflow:hidden;}
.bar div{height:100%;border-radius:7px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
.stat{background:var(--secondary);border-radius:10px;padding:9px 10px;}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;}
.stat span{font-size:10px;color:var(--neutral-dim);text-transform:uppercase;letter-spacing:.05em;}
.list-line{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-top:1px solid var(--line);}
.list-line:first-child{border-top:none;}
.list-line span:last-child{color:var(--neutral-dim);text-align:right;}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;}
.set-row:first-of-type{border-top:none;}
.arr-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);}
.arr-row:first-of-type{border-top:none;}

.arr-row.off .n{color:var(--neutral-dim);text-decoration:line-through;}

.icon-btn:disabled{opacity:.3;}
.switch{flex:none;width:50px;height:30px;border-radius:15px;background:var(--secondary-lighter);border:none;position:relative;cursor:pointer;padding:0;}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;}
.switch.on{background:var(--success);}
.switch.on::after{left:23px;}
.top-back{display:flex;align-items:center;gap:6px;color:var(--neutral-dim);font-size:14px;font-weight:600;margin-bottom:14px;cursor:pointer;background:none;border:none;padding:6px 0;font-family:inherit;}

.login-wrap input{text-align:center;letter-spacing:.08em;text-transform:uppercase;}

  try{ r = await timeoutFetch(FUNCTION_URL, {method:'POST', headers:headers, body:JSON.stringify(body)}); }
  catch(e){ var ne = new Error('network'); ne.network = true; throw ne; }
  var data = null; try{ data = await r.json(); }catch(e){}
  if(!r.ok){
    var err = new Error((data && (data.error || data.message)) || ('Function error '+r.status));

}

/* ---------- on-phone storage (IndexedDB) ---------- */
var DB_NAME='braindump', DB_VERSION=2, _dbp=null;
function db(){
  if(_dbp) return _dbp;
  _dbp = new Promise(function(res, rej){
    var r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = function(){
      var d = r.result;
      if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', {keyPath:'k'});
      if(!d.objectStoreNames.contains('queue')) d.createObjectStore('queue', {keyPath:'seq', autoIncrement:true});
      if(!d.objectStoreNames.contains('media')) d.createObjectStore('media', {keyPath:'id'});   /* photos and videos waiting to upload */
    };
    r.onsuccess = function(){ res(r.result); };
    r.onerror = function(){ rej(r.error); };
  });
  return _dbp;
}
function tx(store, mode, fn){
  return db().then(function(d){
    return new Promise(function(res, rej){
      var t = d.transaction(store, mode), s = t.objectStore(store), out;
      var r = fn(s);
      if(r) r.onsuccess = function(){ out = r.result; };
      t.oncomplete = function(){ res(out); };
      t.onerror = function(){ rej(t.error); };
    });
  });
}
function kvGet(k){ return tx('kv','readonly',function(s){ return s.get(k); }).then(function(r){ return r ? r.v : null; }); }
function kvSet(k, v){ return tx('kv','readwrite',function(s){ return s.put({k:k, v:v}); }); }
function kvDel(k){ return tx('kv','readwrite',function(s){ return s.delete(k); }); }
function qAll(){ return tx('queue','readonly',function(s){ return s.getAll(); }).then(function(r){ return r||[]; }); }
function qAdd(op){ return tx('queue','readwrite',function(s){ return s.add(op); }); }
function qPut(op){ return tx('queue','readwrite',function(s){ return s.put(op); }); }
function qDel(seq){ return tx('queue','readwrite',function(s){ return s.delete(seq); }); }

function mediaPut(m){ return tx('media','readwrite',function(s){ return s.put(m); }); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uuid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var b = new Uint8Array(16); crypto.getRandomValues(b); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;
  var h = Array.prototype.map.call(b, function(x){ return (x+256).toString(16).slice(1); }).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);

function pad(n){ return (n<10?'0':'')+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }

var DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  var days = Math.round((parseYmd(today()) - parseYmd(localDayOf(iso))) / 864e5);

  if(days===1) return 'yesterday';

/* Same rule as the database's _next_due function. Keep the two in step. */
function nextDue(type, every, from, due, doneDay){
  if(type==='none') return null;
  every = Math.max(1, parseInt(every,10)||1);
  var base = (from==='after_done' || !due) ? doneDay : due;
  for(var k=1; k<=1000; k++){
    var n = type==='daily' ? addDays(base, k*every) : type==='weekly' ? addDays(base, k*every*7) : addMonths(base, k*every);
    if(n > doneDay) return n;
  }
  return null;

/* =====================================================================
   LOCAL CHANGES. Each change is applied to the phone straight away,
   saved on the phone, then queued to send to Supabase.
   ===================================================================== */
function applySave(c){
  var cur = chore(c.id);
  if(!cur){ state.chores.push(c); return; }
  if(!cur.updated_at || !c.updated_at || tsMs(c.updated_at) >= tsMs(cur.updated_at)){
    var oldList = list(cur);
    for(var k in c) cur[k] = c[k];
    /* ticks on checklist items are kept (they change through their own tick) */
    cur.checklist = list(c).map(function(it){
      var o = oldList.filter(function(x){ return x.id===it.id; })[0];
      return o ? Object.assign({}, it, {done:o.done, done_by:o.done_by, done_at:o.done_at}) : it;
    });
  }
}
function sameDue(a, b){ return (a||'') === (b||''); }

  if(state.completions.some(function(x){ return x.chore_id===a.chore_id && sameDue(x.for_due_date, a.for_due); })) return false;
  var c = chore(a.chore_id);
  state.completions.unshift({id:a.id, chore_id:a.chore_id, done_by:a.done_by, done_at:a.done_at,
    for_due_date:a.for_due||null, skipped:!!a.skipped, chore_title:c?c.title:'', effort:c?c.effort:1,
    _prev_assigned:c?c.assigned_to:null, _prev_checklist:c?JSON.parse(JSON.stringify(list(c))):null});
  if(c && !a.skipped){ c.last_done_at = a.done_at; c.last_done_by = a.done_by; }
  if(c && sameDue(c.next_due, a.for_due) && !c.finished){
    if(c.repeat_type==='none') c.finished = true;
    else {
      c.next_due = nextDue(c.repeat_type, c.repeat_every, c.repeat_from, c.next_due, a.today);
      c.checklist = list(c).map(function(it){ return Object.assign({}, it, {done:false, done_by:null, done_at:null}); });
      if(c.rotate && c.assigned_to && !a.skipped) c.assigned_to = otherOf(c.assigned_to);
    }
    c.updated_at = a.done_at;
  }
  return true;
}
function applyUndo(a){
  var x = null;
  state.completions = state.completions.filter(function(y){ if(y.id===a.id){ x = y; return false; } return true; });
  if(!x) return;
  var c = chore(x.chore_id);
  if(!c) return;
  var lastDone = state.completions.filter(function(y){ return y.chore_id===x.chore_id && !y.skipped; }).sort(function(p,q){ return tsMs(q.done_at)-tsMs(p.done_at); })[0];
  c.last_done_at = lastDone ? lastDone.done_at : null; c.last_done_by = lastDone ? lastDone.done_by : null;
  var later = state.completions.some(function(y){ return y.chore_id===x.chore_id && (y.for_due_date||'') > (x.for_due_date||''); });
  if(!later){
    c.next_due = x.for_due_date; c.finished = false; c.updated_at = nowISO();
    if(x._prev_assigned !== undefined) c.assigned_to = x._prev_assigned;
    if(x._prev_checklist) c.checklist = x._prev_checklist;
  }
}
function applyToggle(a){
  var c = chore(a.chore_id); if(!c) return;
  c.checklist = list(c).map(function(it){ return it.id===a.item_id ? Object.assign({}, it, {done:a.done, done_by:a.done?a.by:null, done_at:a.done?a.at:null}) : it; });
}
function applyOp(op){

  else if(op.type==='del_comment') state.comments = state.comments.filter(function(m){ return m.id!==a.id; });
  else if(op.type==='upload'){ if(!state.attachments.some(function(x){ return x.id===a.id; })) state.attachments.push({id:a.id, chore_id:a.chore_id, kind:a.kind, mime:a.mime, created_by:a.by, created_at:a.at, _pending:true}); if(a.thumb) state.thumbs[a.id] = a.thumb; }

async function saveCache(){
  try{ await kvSet('cache', {people:state.people, chores:state.chores, completions:state.completions, comments:state.comments,
    attachments:state.attachments, lastSync:state.lastSync, version:state.version}); }catch(e){}
}
async function change(type, args){
  var op = {type:type, args:args, attempts:0, createdAt:nowISO()};
  applyOp(op);
  try{ await qAdd(op); }catch(e){ console.error('Could not queue change', e); }
  state.queue = await qAll().catch(function(){ return state.queue; });
  await saveCache();
  render();
  syncNow();
}

/* =====================================================================
   SYNC: send the queue in order, then fetch the latest from Supabase.
   ===================================================================== */
function isNetworkError(err){
  if(!err) return false;
  if(err.network) return true;
  var m = String(err.message||err);
  return (!err.code && !err.status) || /fetch|network|load failed|abort|timed? ?out/i.test(m);
}
async function rpcOrThrow(client, fn, args){
  var res = await client.rpc(fn, args);
  if(res.error) throw res.error;
  return res.data;
}
async function uploadMedia(client, a){
  var m = await mediaGet(a.id);
  if(!m) return 'drop';                                      /* the file is no longer on this phone */
  state.uploading = a.id; safeRender();
  var link = await callFn({action:'upload', chore_id:a.chore_id, ext:a.ext});
  var body = await m.blob.arrayBuffer();
  var up = await client.storage.from('chore-media').uploadToSignedUrl(link.path, link.token, body, {contentType:a.mime||'application/octet-stream'});
  if(up.error){
    var e = new Error(up.error.message || up.error.error || 'Upload failed');
    e.status = up.error.statusCode ? +up.error.statusCode : 400;
    if(/maximum allowed size|too large|payload/i.test(e.message)) e.tooBig = true;
    throw e;
  }
  await rpcOrThrow(client, 'add_attachment', {p_code:state.me.code, p_id:a.id, p_chore_id:a.chore_id, p_path:link.path,
    p_kind:a.kind, p_mime:a.mime, p_size:a.size, p_thumb:a.thumb||null});
  await mediaDel(a.id);
  state.uploading = null;
}
async function sendOp(client, op){
  var a = op.args, code = state.me.code;
  switch(op.type){
    case 'save': await rpcOrThrow(client, 'save_chore', {p_code:code, p_chore:a.chore}); break;
    case 'complete': await rpcOrThrow(client, 'complete_chore', {p_code:code, p_id:a.id, p_chore_id:a.chore_id, p_for_due:a.for_due||null, p_skipped:!!a.skipped, p_done_at:a.done_at, p_today:a.today}); break;
    case 'undo': await rpcOrThrow(client, 'undo_completion', {p_code:code, p_id:a.id}); break;
    case 'toggle': await rpcOrThrow(client, 'toggle_item', {p_code:code, p_chore_id:a.chore_id, p_item_id:a.item_id, p_done:a.done, p_at:a.at}); break;
    case 'comment': await rpcOrThrow(client, 'add_comment', {p_code:code, p_id:a.id, p_chore_id:a.chore_id, p_body:a.body, p_at:a.at}); break;
    case 'del_comment': await rpcOrThrow(client, 'delete_comment', {p_code:code, p_id:a.id}); break;
    case 'del_attachment': await rpcOrThrow(client, 'delete_attachment', {p_code:code, p_id:a.id}); await mediaDel(a.id).catch(function(){}); break;
    case 'away': await rpcOrThrow(client, 'set_away', {p_code:code, p_from:a.from||null, p_until:a.until||null, p_mode:a.mode||null}); break;
    case 'reminders': await rpcOrThrow(client, 'set_reminders', {p_code:code, p_hour:a.hour, p_notify_partner:a.notify}); break;
    case 'upload': return await uploadMedia(client, a);
  }
}
/* after a change reaches the database, tell the other phone if it needs to know */
function notifyAfter(op){
  var a = op.args;
  if(op.type==='save' && a.notify) callFn({action:'notify', kind:'assigned', title:a.chore.title, chore_id:a.chore.id}).catch(function(){});
  if(op.type==='comment'){ var c = chore(a.chore_id); callFn({action:'notify', kind:'comment', title:c?c.title:'a chore', text:a.body, chore_id:a.chore_id}).catch(function(){}); }
}
async function flushQueue(client){
  var ops = await qAll(), allSent = true;
  for(var i=0;i<ops.length;i++){
    var op = ops[i], err = null, res;
    try{ res = await sendOp(client, op); }catch(e){ err = e; }
    if(op.type==='upload') state.uploading = null;
    if(!err){ await qDel(op.seq); if(res!=='drop') notifyAfter(op); continue; }
    if(isNetworkError(err)) return false;                     /* no signal: try again later */
    if(err.code==='28000'){ await forceLogout(); return false; }
    console.error('Change refused', op.type, err);
    op.attempts = (op.attempts||0)+1;
    op.lastError = err.tooBig ? 'too big' : (err.noFunction ? 'no function' : String(err.message||err).slice(0,120));
    var keep = op.type==='upload' && !err.tooBig && op.attempts < 50;  /* uploads keep trying (e.g. until the function is set up) */
    if(!keep && op.attempts >= 5 || err.tooBig){
      await qDel(op.seq); state.failedOps++;
      if(op.type==='upload'){ await mediaDel(op.args.id).catch(function(){}); state.attachments = state.attachments.filter(function(x){ return x.id!==op.args.id; }); toast(err.tooBig ? 'That video is too big for your Supabase plan.' : 'A photo or video could not be uploaded.'); }
    } else await qPut(op);
    allSent = false;
    if(op.type!=='upload') return false;                      /* keep later changes in order behind this one */
  }
  return allSent;
}
async function pull(client, force){
  var ver = await client.rpc('get_version', {p_code:state.me.code});
  if(ver.error){ if(ver.error.code==='28000') await forceLogout(); return false; }
  if(!force && state.version!==null && ver.data===state.version && state.lastSync) { state.lastSync = nowISO(); return true; }
  var res = await client.rpc('get_state', {p_code:state.me.code});
  if(res.error){ if(res.error.code==='28000') await forceLogout(); return false; }
  var d = res.data || {};
  state.people = d.people || [];
  state.chores = d.chores || [];
  state.completions = d.completions || [];
  state.comments = d.comments || [];
  state.attachments = d.attachments || [];
  state.version = d.version;
  /* anything still waiting to send is laid back on top, so it never vanishes */
  var pending = await qAll();
  pending.forEach(applyOp);
  state.queue = pending;
  state.lastSync = nowISO();
  await saveCache();
  await fetchThumbs(client);
  return true;
}
async function fetchThumbs(client){
  var missing = state.attachments.filter(function(a){ return !a._pending && !state.thumbs[a.id]; }).map(function(a){ return a.id; });
  if(!missing.length) return;
  var res = await client.rpc('get_thumbs', {p_code:state.me.code, p_ids:missing});
  if(res.error || !res.data) return;
  for(var k in res.data) state.thumbs[k] = res.data[k];
  try{ await kvSet('thumbs', state.thumbs); }catch(e){}
}
async function syncNow(force){
  if(state.syncing || !state.me) return;
  if(!window.supabase && navigator.onLine) await ensureLib();
  var client = getClient();
  state.online = navigator.onLine;
  if(!client || !state.online){ state.queue = await qAll().catch(function(){ return state.queue; }); safeRender(); return; }
  state.syncing = true;
  try{
    await flushQueue(client);
    if(state.me) await pull(client, force);
    if(state.fnOk===null && state.me) checkFunction();
  }catch(e){ console.error('Sync failed, will retry', e); }
  state.syncing = false;
  state.queue = await qAll().catch(function(){ return state.queue; });
  safeRender();
}
async function checkFunction(){
  try{ var r = await callFn({action:'ping'}); state.fnOk = true; state.vapidKey = r.vapidPublicKey; await kvSet('vapid', r.vapidPublicKey); }
  catch(e){ if(!e.network) state.fnOk = false; }
  safeRender();
}
/* don't redraw under someone's fingers while they are typing */
function safeRender(){
  var a = document.activeElement;
  if(state.screen==='edit' || state.screen==='paste' || (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && document.getElementById('app').contains(a))){ state.pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', function(){ setTimeout(function(){ if(state.pendingRender) safeRender(); }, 400); });
async function forceLogout(){
  await qClear().catch(function(){}); await mediaClear().catch(function(){});
  await kvDel('auth').catch(function(){}); await kvDel('cache').catch(function(){});
  state.me = null; state.people=[]; state.chores=[]; state.completions=[]; state.comments=[]; state.attachments=[]; state.queue=[];
  state.screen = 'login'; state.version = null;
  state.loginError = 'Your access code has changed. Please log in again.';
  render();
}

  var pend = state.queue.length, cls = '', txt = 'Up to date';
  if(!state.online){ cls='offline'; txt = pend ? 'Offline · '+pend+' to send' : 'Offline'; }
  else if(state.uploading){ cls='pending'; txt = 'Uploading…'; }

function choreRow(c, tab){
  var late = isLate(c), paused = isPaused(c);
  var who = '';
  if(!c.assigned_to) who = '<span class="who either">Either</span>';
  else if(isCovering(c)) who = whoChip(person(c.assigned_to));
  var items = list(c), done = items.filter(function(i){ return i.done; }).length;
  var nC = commentsFor(c.id).length, nM = mediaFor(c.id).length;
  var lastBy = c.last_done_by && person(c.last_done_by);
  var sub = '<span class="'+(late?'late':'')+'">'+esc(paused?'Paused · '+dueLabel(c):dueLabel(c))+'</span><span>'+esc(c.room)+'</span><span>↻ '+esc(repeatLabel(c))+'</span>'+effortDots(c.effort);
  if(items.length) sub += '<span class="meta">'+icon('box',13)+done+'/'+items.length+'</span>';
  if(nM) sub += '<span class="meta">'+icon('clip',13)+nM+'</span>';
  if(nC) sub += '<span class="meta">'+icon('chat',13)+nC+'</span>';
  if(c.last_done_at) sub += '<span>Last done '+esc(agoLabel(c.last_done_at))+(lastBy?' · '+esc(lastBy.name):'')+'</span>';
  if(isCovering(c)) sub += '<span>Covering for '+esc(person(c.assigned_to).name)+'</span>';
  return '<div class="chore'+(late?' late':'')+(paused?' paused':'')+'" data-chore="'+esc(c.title)+'">'+
    '<button class="tick" aria-label="Mark '+esc(c.title)+' done" onclick="App.tick(\''+c.id+'\',this)">'+icon('check',18)+'</button>'+
    '<div class="chore-main" onclick="App.openChore(\''+c.id+'\')">'+
      '<div class="chore-title">'+esc(c.title)+'</div><div class="chore-sub">'+sub+'</div>'+
    '</div>'+who+'</div>';
}
function groupByDate(list_){
  var t = today(), tm = addDays(t,1), wk = addDays(t,6);
  var g = [['Overdue',[]],['Today',[]],['Tomorrow',[]],['This week',[]],['Later',[]],['No date',[]],['Paused while away',[]]];
  list_.forEach(function(c){
    var d = c.next_due;
    if(isPaused(c)) g[6][1].push(c);
    else if(!d) g[5][1].push(c);
    else if(d < t) g[0][1].push(c);
    else if(d===t) g[1][1].push(c);
    else if(d===tm) g[2][1].push(c);
    else if(d<=wk) g[3][1].push(c);
    else g[4][1].push(c);
  });
  return g.filter(function(x){ return x[1].length; });
}
function groupByRoom(list_){
  return allRooms().map(function(r){ return [r, list_.filter(function(c){ return c.room===r; })]; }).filter(function(x){ return x[1].length; });
}
function awayBanner(){
  var me = myRecord(), p = partner(), h = '';
  if(isAway(me)) h += '<div class="banner">You\'re away'+(me.away_until?' until '+esc(niceDate(me.away_until)):'')+'. '+(me.away_mode==='pause'?'Your chores are paused.':'Your chores are with '+esc(p.name)+'.')+' <button class="linkish" onclick="App.go(\'settings\')">Change</button></div>';
  if(p.id && isAway(p)) h += '<div class="banner">'+esc(p.name)+' is away'+(p.away_until?' until '+esc(niceDate(p.away_until)):'')+'. '+(p.away_mode==='pause'?esc(p.name)+'\'s chores are paused.':esc(p.name)+'\'s chores are on your list.')+'</div>';
  return h;
}

    '<button class="'+(tab==='partner'?'active':'')+'" onclick="App.setTab(\'partner\')">'+esc(p.name)+'</button>'+

  var gb = state.settings.groupBy;
  h += '<div class="subbar"><span>'+lst.length+' chore'+(lst.length===1?'':'s')+'</span>'+

  if(!lst.length && !hiddenCount){
    h += '<div class="empty">'+brainSVG(56)+'<br>'+(tab==='mine'?'Nothing on your list. Tap + to add a chore.':esc(p.name)+' has nothing on their list.')+'</div>';
  }
  var groups = gb==='room' ? groupByRoom(lst) : groupByDate(lst);
  groups.forEach(function(g){
    h += '<div class="group-h'+(g[0]==='Overdue'?' overdue':'')+'"><span>'+esc(g[0])+'</span><span>'+g[1].length+'</span></div>';
    g[1].forEach(function(c){ h += choreRow(c, tab); });
  });
  if(hiddenCount) h += '<div class="hidden-note">'+hiddenCount+' in hidden rooms · <button class="linkish" onclick="App.toggleHidden()">Show</button></div>';
  else if(state.showHidden && (state.settings.hiddenRooms||[]).length) h += '<div class="hidden-note"><button class="linkish" onclick="App.toggleHidden()">Hide hidden rooms again</button></div>';
  return h;
}
function doneList(){
  var wk = startOfWeek(today()), lastWk = addDays(wk, -7);
  var items = state.completions.filter(function(x){ return localDayOf(x.done_at) >= lastWk; })
    .sort(function(a,b){ return tsMs(b.done_at) - tsMs(a.done_at); });
  if(!items.length) return '<div class="empty">Nothing ticked off yet this week.</div>';
  var h = '', lastDay = null, t = today();
  items.forEach(function(x){
    var d = localDayOf(x.done_at);
    if(d!==lastDay){
      if(lastDay!==null) h += '</div>';
      var label = d===t ? 'Today' : d===addDays(t,-1) ? 'Yesterday' : niceDate(d);
      if(lastDay===null || (lastDay>=wk && d<wk)) h += '<div class="group-h"><span>'+(d>=wk?'This week':'Last week')+'</span></div>';
      h += '<div class="card" style="padding:4px 14px;"><div class="eyebrow" style="margin:10px 0 2px;">'+label+'</div>';
      lastDay = d;
    }
    var p = person(x.done_by), c = chore(x.chore_id);
    var title = (c && c.title) || x.chore_title || 'Chore';
    h += '<div class="done-row">'+whoChip(p)+
      '<div class="t'+(x.skipped?' skipped':'')+'">'+esc(title)+'<span>'+(x.skipped?'Skipped':'Done')+' by '+esc(p?p.name:'?')+' · '+timeOf(x.done_at)+'</span></div>'+
      '<button class="small-btn" onclick="App.undo(\''+x.id+'\')">Undo</button></div>';
  });
  return h + '</div>';
}

/* ---------- fairness ---------- */
function fairStats(from){
  var res = {};
  state.people.forEach(function(p){ res[p.id] = {p:p, done:0, points:0, skipped:0, titles:{}}; });
  state.completions.forEach(function(x){
    if(localDayOf(x.done_at) < from) return;
    var r = res[x.done_by]; if(!r) return;
    if(x.skipped){ r.skipped++; return; }
    var c = chore(x.chore_id), title = (c&&c.title)||x.chore_title||'Chore';
    r.done++; r.points += (x.effort||1);
    r.titles[title] = (r.titles[title]||0)+1;
  });
  return state.people.map(function(p){ return res[p.id]; });
}
function rangeStart(){ return state.fairRange==='week' ? startOfWeek(today()) : startOfMonth(today()); }
function rangeLabel(){ return state.fairRange==='week' ? 'Week of '+niceDate(startOfWeek(today())) : (function(){ var d=parseYmd(today()); return ['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()]+' '+d.getFullYear(); })(); }
function screenFair(){
  var stats = fairStats(rangeStart());
  var maxP = Math.max.apply(null, [1].concat(stats.map(function(s){ return s.points; })));
  var h = '<h1 class="page-title">Fairness</h1>'+
    '<div class="seg"><button class="'+(state.fairRange==='week'?'active':'')+'" onclick="App.setRange(\'week\')">This week</button>'+
    '<button class="'+(state.fairRange==='month'?'active':'')+'" onclick="App.setRange(\'month\')">This month</button></div>'+
    '<div class="card"><div class="eyebrow">'+esc(rangeLabel())+'</div>';
  stats.forEach(function(s){
    h += '<div class="fair-row"><div class="fair-top">'+whoChip(s.p)+'<span class="n">'+esc(s.p.name)+'</span><span class="v">'+s.points+' pts</span></div>'+
      '<div class="bar"><div style="width:'+Math.round(100*s.points/maxP)+'%;background:'+esc(s.p.colour)+'"></div></div>'+
      '<div class="stat-grid"><div class="stat"><b>'+s.done+'</b><span>Chores</span></div><div class="stat"><b>'+s.points+'</b><span>Effort pts</span></div><div class="stat"><b>'+s.skipped+'</b><span>Skipped</span></div></div></div>';
  });
  h += '<div class="hint" style="margin:0;">Effort points: small chore 1, medium 2, big 3. Skips do not count.</div></div>';
  stats.forEach(function(s){
    var t = Object.keys(s.titles).sort(function(a,b){ return s.titles[b]-s.titles[a] || a.localeCompare(b); });
    h += '<div class="card"><div class="eyebrow">What '+esc(s.p.name)+' did</div>';
    if(!t.length) h += '<div style="font-size:14px;color:var(--neutral-dim)">Nothing yet.</div>';
    t.forEach(function(k){ h += '<div class="list-line"><span>'+esc(k)+'</span><span>× '+s.titles[k]+'</span></div>'; });
    h += '</div>';
  });
  h += '<button class="btn btn-primary" onclick="App.shareSummary()">'+icon('share',18)+'Share summary</button>';
  return h;
}
function summaryText(){
  var stats = fairStats(rangeStart());
  var lines = ['Brain Dump – '+rangeLabel(), ''];
  stats.forEach(function(s){ lines.push(s.p.name+': '+s.done+' chore'+(s.done===1?'':'s')+', '+s.points+' effort point'+(s.points===1?'':'s')+(s.skipped?' ('+s.skipped+' skipped)':'')); });
  stats.forEach(function(s){
    var t = Object.keys(s.titles);
    if(t.length){ lines.push(''); lines.push(s.p.name+' did:'); t.forEach(function(k){ lines.push('• '+k+(s.titles[k]>1?' ×'+s.titles[k]:'')); }); }
  });
  return lines.join('\n');
}

/* Turns copied note text into clean lines: removes bullets, numbers, checkboxes and blank lines */
function parseNote(text){
  return String(text||'').replace(/\r\n?/g,'\n').replace(/[\u2028\u2029]/g,'\n').split('\n').map(function(l){
    l = l.replace(/[\u200b-\u200f\ufeff\ufffc\u00a0]/g, ' ');
    for(var k=0;k<3;k++) l = l.replace(/^\s*(?:[-–—*•◦▪▫‣·○●■□☐☑☒✓✔✗✘⬜✅❌➤→>]+|\[\s*[xX✓✔]?\s*\]|\(\s*[xX]?\s*\)|\d{1,3}[.)]|[a-zA-Z][.)](?=\s))\s*/, '');
    return l.replace(/\s+/g,' ').trim().slice(0,200);
  }).filter(function(l){ return l && !/^[-–—_=*.~]{2,}$/.test(l); });
}

/* ---------- photos and videos ---------- */
function loadImage(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){ res({img:img, url:url}); };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('Could not read the picture')); };
    img.src = url;
  });
}
function drawScaled(src, w, h, max, quality){
  var s = Math.min(1, max/Math.max(w, h)), cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(w*s)); cv.height = Math.max(1, Math.round(h*s));
  cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
  return cv;
}
function canvasBlob(cv, q){ return new Promise(function(res){ cv.toBlob(function(b){ res(b); }, 'image/jpeg', q); }); }
async function preparePhoto(file){
  try{
    var r = await loadImage(file);
    var big = drawScaled(r.img, r.img.naturalWidth, r.img.naturalHeight, PHOTO_MAX_PX);
    var blob = await canvasBlob(big, 0.82);
    var thumb = drawScaled(r.img, r.img.naturalWidth, r.img.naturalHeight, 240).toDataURL('image/jpeg', 0.7);
    URL.revokeObjectURL(r.url);
    return {blob:blob, mime:'image/jpeg', ext:'jpg', thumb:thumb};
  }catch(e){
    var ext = (file.name.split('.').pop()||'jpg').toLowerCase();
    return {blob:file, mime:file.type||'image/jpeg', ext:ext, thumb:null};
  }
}
function videoThumb(file){
  return new Promise(function(res){
    var url = URL.createObjectURL(file), v = document.createElement('video'), done = false;
    function finish(t){ if(done) return; done = true; URL.revokeObjectURL(url); res(t); }
    v.muted = true; v.playsInline = true; v.preload = 'metadata'; v.src = url;
    v.onloadeddata = function(){ try{ v.currentTime = Math.min(0.5, (v.duration||1)/2); }catch(e){ finish(null); } };
    v.onseeked = function(){ try{ finish(drawScaled(v, v.videoWidth, v.videoHeight, 240).toDataURL('image/jpeg', 0.7)); }catch(e){ finish(null); } };
    v.onerror = function(){ finish(null); };
    setTimeout(function(){ finish(null); }, 5000);
  });
}
async function signedUrl(path){
  var c = state.urlCache[path];
  if(c && Date.now()-c.at < 50*60000) return c.url;
  var r = await callFn({action:'view', paths:[path]});
  var url = r.urls && r.urls[path];
  if(url) state.urlCache[path] = {url:url, at:Date.now()};
  return url;
}

/* ---------- calendar ---------- */
function icsText(c){
  function dt(d){ return d.replace(/-/g,''); }
  function escI(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
  var stamp = nowISO().replace(/[-:]/g,'').replace(/\.\d+/,'');
  var lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Brain Dump//Chores//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:'+c.id+'@brain-dump','DTSTAMP:'+stamp];
  if(c.due_time){
    var t = c.due_time.replace(':','')+'00', endH = (parseInt(c.due_time.slice(0,2),10)+1)%24;
    lines.push('DTSTART:'+dt(c.next_due)+'T'+t, 'DTEND:'+dt(c.next_due)+'T'+pad(endH)+c.due_time.slice(3,5)+'00');
  } else {
    lines.push('DTSTART;VALUE=DATE:'+dt(c.next_due), 'DTEND;VALUE=DATE:'+dt(addDays(c.next_due,1)));
  }
  if(c.repeat_type!=='none' && c.repeat_from==='schedule') lines.push('RRULE:FREQ='+{daily:'DAILY',weekly:'WEEKLY',monthly:'MONTHLY'}[c.repeat_type]+';INTERVAL='+(c.repeat_every||1));
  lines.push('SUMMARY:'+escI(c.title), 'DESCRIPTION:'+escI((c.notes?c.notes+'\n':'')+'From Brain Dump'), 'END:VEVENT', 'END:VCALENDAR');
  return lines.join('\r\n')+'\r\n';
}
function downloadBlob(blob, name){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ---------- reminders (push notifications) ---------- */
function b64ToBytes(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s += '='; var b = atob(s), o = new Uint8Array(b.length); for(var i=0;i<b.length;i++) o[i] = b.charCodeAt(i); return o; }
async function pushRegistration(){ if(!('serviceWorker' in navigator)) return null; return navigator.serviceWorker.ready; }
async function refreshPushState(){
  var ps = state.push;
  ps.supported = !!('serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window) && !(isIOS() && !isStandalone());
  if(!ps.supported) return;
  try{
    var reg = await Promise.race([pushRegistration(), new Promise(function(r){ setTimeout(function(){ r(null); }, 3000); })]);
    var sub = reg && await reg.pushManager.getSubscription();
    ps.subscribed = !!sub && Notification.permission==='granted';
  }catch(e){ ps.subscribed = false; }
}

  pasteSkip: function(i){ state.paste.skip[i] = !state.paste.skip[i]; var y = window.scrollY; render(); window.scrollTo(0,y); },
  pasteRoom: function(v){
    if(v==='__new'){ var n = prompt('Name of the new room'); n = n ? n.trim().slice(0,30) : ''; if(n) state.paste.room = n; }
    else state.paste.room = v;
    var y = window.scrollY; render(); window.scrollTo(0,y);
  },
  cancelPaste: function(){ state.paste = null; state.screen = 'home'; render(); },
  pasteCreate: function(){
    var d = state.paste, lines = parseNote(d.text), skip = d.skip||{};
    var base = {notes:'', room:d.room||'Other', assigned_to:d.assigned_to||null, repeat_type:d.repeat_type, repeat_every:1, repeat_from:'schedule',
      next_due:d.next_due||null, due_time:null, effort:1, finished:false, archived:false, rotate:false};
    if(d.repeat_type!=='none' && !base.next_due) base.next_due = today();
    var made = 0, firstId = null, notifyAny = base.assigned_to && base.assigned_to!==state.me.id;
    if(d.mode==='checklist'){
      var useFirst = d.firstIsTitle && lines.length>1;
      var titleEl = document.getElementById('pasteTitle');
      var title = ((titleEl ? titleEl.value : d.title) || (useFirst ? lines[0] : '') || 'Checklist').trim();
      var items = lines.map(function(l, i){ return {l:l, i:i}; }).filter(function(x){ return !(useFirst && x.i===0) && !skip[x.i]; });
      var c = Object.assign({}, base, {id:uuid(), title:title.slice(0,200), checklist:items.map(function(x){ return {id:uuid().slice(0,8), text:x.l, done:false}; }), updated_at:nowISO()});
      change('save', {chore:c, notify:notifyAny?'assigned':null}); made = 1; firstId = c.id;
    } else {
      lines.forEach(function(l, i){
        if(skip[i]) return;
        var c = Object.assign({}, base, {id:uuid(), title:l, checklist:[], updated_at:nowISO()});
        change('save', {chore:c, notify:(notifyAny && made===0)?'assigned':null}); made++;
      });
    }
    state.paste = null; state.screen = 'home'; render();
    toast(d.mode==='checklist' ? 'Added a chore with a checklist' : 'Added '+made+' chore'+(made===1?'':'s'));
  },

  /* comments */
  sendComment: function(cid){
    var t = document.getElementById('commentInput'), body = (t ? t.value : state.commentDraft).trim();
    if(!body) return;
    state.commentDraft = '';
    if(t) t.blur();
    change('comment', {id:uuid(), chore_id:cid, body:body.slice(0,2000), at:nowISO(), by:state.me.id});
  },
  deleteComment: function(id){ if(!confirm('Delete this comment?')) return; change('del_comment', {id:id}); },

  /* photos and videos */
  addMedia: async function(cid, input){
    var files = Array.prototype.slice.call(input.files||[]);
    input.value = '';
    for(var i=0;i<files.length;i++){
      var f = files[i], isVideo = /^video\//.test(f.type) || /\.(mov|mp4|m4v|3gp)$/i.test(f.name);
      if(isVideo && f.size > MAX_VIDEO_MB*1024*1024){ alert('"'+f.name+'" is '+Math.round(f.size/1048576)+' MB. Videos can be up to '+MAX_VIDEO_MB+' MB (about a minute or two). Try a shorter clip.'); continue; }
      toast('Preparing '+(isVideo?'video':'photo')+'…');
      var prep = isVideo ? {blob:f, mime:f.type||'video/mp4', ext:(f.name.split('.').pop()||'mp4').toLowerCase(), thumb:await videoThumb(f)} : await preparePhoto(f);
      var id = uuid();
      try{ await mediaPut({id:id, blob:prep.blob, mime:prep.mime}); }
      catch(e){ alert('Could not keep the file on this phone. It may be too big for the space left.'); continue; }
      await change('upload', {id:id, chore_id:cid, kind:isVideo?'video':'photo', mime:prep.mime, ext:prep.ext, size:prep.blob.size, thumb:prep.thumb, by:state.me.id, at:nowISO()});
    }
    document.getElementById('toastHost').innerHTML = '';
  },
  viewMedia: async function(id){
    var m = state.attachments.filter(function(x){ return x.id===id; })[0]; if(!m) return;
    var host = document.getElementById('viewerHost'), by = person(m.created_by);
    host.innerHTML = '<div class="viewer" role="dialog"><div class="vbar"><button class="vbtn" onclick="App.closeViewer()">Close</button>'+
      '<span style="font-size:12px;opacity:.8">'+esc(by?by.name:'')+' · '+esc(whenLabel(m.created_at))+'</span></div>'+
      '<div class="stage" id="viewerStage">Loading…</div>'+
      '<div class="vbar bot"><button class="vbtn" id="viewerSave" onclick="App.saveMedia(\''+id+'\')">Save to phone</button><button class="vbtn danger" onclick="App.deleteMedia(\''+id+'\')">Delete</button></div></div>';
    var url = null;
    try{
      if(m._pending){ var local = await mediaGet(id); if(local){ url = URL.createObjectURL(local.blob); window._viewerUrl = url; } }
      else if(m.path) url = await signedUrl(m.path);
    }catch(e){}
    var stage = document.getElementById('viewerStage'); if(!stage) return;
    if(!url){ stage.innerHTML = state.thumbs[id] ? '<img src="'+esc(state.thumbs[id])+'" alt=""><div style="position:absolute;bottom:90px;font-size:12px">Full size needs signal</div>' : 'Needs signal to load'; return; }
    stage.innerHTML = m.kind==='video' ? '<video src="'+esc(url)+'" controls playsinline autoplay></video>' : '<img src="'+esc(url)+'" alt="">';
  },
  closeViewer: closeViewer,
  saveMedia: async function(id){
    var m = state.attachments.filter(function(x){ return x.id===id; })[0]; if(!m) return;
    var btn = document.getElementById('viewerSave'); if(btn) btn.textContent = 'Getting file…';
    try{
      var blob;
      if(m._pending){ var local = await mediaGet(id); blob = local && local.blob; }
      else { var url = await signedUrl(m.path); blob = await (await fetch(url)).blob(); }
      if(!blob) throw new Error('none');
      var ext = (m.path||'').split('.').pop() || (m.kind==='video'?'mp4':'jpg');
      var name = 'brain-dump-'+(m.kind==='video'?'video':'photo')+'-'+today()+'.'+ext, file = null;
      try{ file = new File([blob], name, {type:m.mime||blob.type}); }catch(e){}
      if(file && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); }
      else downloadBlob(blob, name);
    }catch(e){ if(!e || e.name!=='AbortError') alert('Could not get the file. Check your signal and try again.'); }
    if(btn) btn.textContent = 'Save to phone';
  },
  deleteMedia: function(id){
    if(!confirm('Delete this from both phones?')) return;
    closeViewer();
    change('del_attachment', {id:id});
  },

  addToCalendar: async function(id){
    var c = chore(id); if(!c || !c.next_due) return;
    var blob = new Blob([icsText(c)], {type:'text/calendar'}), name = c.title.replace(/[^\w\- ]+/g,'').slice(0,40)+'.ics';
    var file = null; try{ file = new File([blob], name, {type:'text/calendar'}); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:c.title}); return; }catch(e){ if(e && e.name==='AbortError') return; }
    }
    downloadBlob(blob, name);
  },

  /* away mode */
  awayMode: function(m){ state.awayDraft.mode = m; render(); },
  setAway: function(){
    var a = state.awayDraft, f = document.getElementById('awayFrom'), u = document.getElementById('awayUntil');
    if(f) a.from = f.value; if(u) a.until = u.value;
    if(!a.from){ alert('Choose the first day you\'re away.'); return; }
    if(a.until && a.until < a.from){ alert('The end date is before the start date.'); return; }
    change('away', {from:a.from, until:a.until||null, mode:a.mode});
    toast('Away mode set');
  },
  clearAway: function(){ state.awayDraft = null; change('away', {from:null, until:null, mode:null}); toast('Welcome back'); },

  /* reminders */
  enablePush: async function(){
    var ps = state.push; ps.busy = true; ps.msg = ''; render();
    try{
      if(!state.vapidKey){ var r = await callFn({action:'ping'}); state.vapidKey = r.vapidPublicKey; state.fnOk = true; }
      var perm = await Notification.requestPermission();
      if(perm!=='granted') throw new Error('Notifications were not allowed. You can allow them in iPhone Settings > Notifications > Brain Dump.');
      var reg = await pushRegistration();
      var sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(state.vapidKey)});
      var client = getClient();
      var res = await client.rpc('save_push_sub', {p_code:state.me.code, p_sub:JSON.parse(JSON.stringify(sub)), p_app_url:location.href.split('#')[0].split('?')[0]});
      if(res.error) throw res.error;
      var me = myRecord();
      if(me.remind_hour==null) await change('reminders', {hour:8, notify:me.notify_partner!==false});
      ps.subscribed = true; ps.msg = 'Reminders are on. Try "Send a test".';
    }catch(e){ ps.msg = e && e.network ? 'No signal. Try again when you\'re online.' : String((e && e.message) || e); }
    ps.busy = false; render();
  },
  disablePush: async function(){
    try{
      var reg = await pushRegistration(), sub = reg && await reg.pushManager.getSubscription();
      if(sub){ var client = getClient(); if(client) await client.rpc('delete_push_sub', {p_code:state.me.code, p_endpoint:sub.endpoint}); await sub.unsubscribe(); }
    }catch(e){}
    state.push.subscribed = false; state.push.msg = ''; render();
  },
  testPush: async function(){
    state.push.msg = 'Sending…'; render();
    try{ var r = await callFn({action:'test'}); state.push.msg = (r.results||[]).some(function(x){ return x===201 || x===200; }) ? 'Sent. It should appear in a few seconds.' : 'Nothing was sent. Try turning reminders off and on again.'; }
    catch(e){ state.push.msg = e.network ? 'No signal.' : 'Could not send: '+e.message; }
    render();
  },
  setRemindHour: function(v){ var me = myRecord(); change('reminders', {hour:v===''?null:parseInt(v,10), notify:me.notify_partner!==false}); },
  toggleNotifyPartner: function(){ var me = myRecord(); change('reminders', {hour:me.remind_hour==null?null:me.remind_hour, notify:me.notify_partner===false}); },

  shareSummary: function(){
    var text = summaryText(), title = 'Brain Dump summary';
    if(navigator.share){
      navigator.share({title:title, text:text}).catch(function(e){ if(!e || e.name!=='AbortError') App.shareFallback(); });
    } else App.shareFallback();
  },
  shareFallback: function(){
    var text = summaryText();
    openSheet('<h3>Share summary</h3><div class="st-sub">Sharing from here is not available on this device, so copy it or save it instead.</div>'+
      '<pre class="share-text">'+esc(text)+'</pre>'+
      '<button class="btn btn-primary btn-slim" onclick="App.copySummary()">Copy</button>'+
      '<button class="btn btn-secondary btn-slim" onclick="App.saveSummary()">Save to this phone</button>'+
      '<button class="btn btn-secondary btn-slim" onclick="App.closeSheet()">Close</button>');
  },
  copySummary: function(){
    var text = summaryText();
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function(){ closeSheet(); toast('Copied'); }).catch(function(){ toast('Could not copy. Use Save instead.'); });
  },
  saveSummary: function(){ downloadBlob(new Blob([summaryText()], {type:'text/plain'}), 'brain-dump-summary-'+today()+'.txt'); closeSheet(); },

  setTheme: async function(t){ state.settings.theme = t; await saveSettings(); try{ document.querySelector('meta[name="theme-color"]').setAttribute('content', t==='light'?'#F2F1F8':'#1C1F3A'); }catch(e){} render(); },
  moveRoom: async function(i, dir){
    var o = allRooms(), j = i+dir;
    if(j<0 || j>=o.length) return;
    var tmp = o[i]; o[i] = o[j]; o[j] = tmp;
    state.settings.roomOrder = o; await saveSettings(); render();
  },
  toggleRoom: async function(i){
    var r = allRooms()[i], h = state.settings.hiddenRooms = state.settings.hiddenRooms||[];
    var k = h.indexOf(r); if(k>=0) h.splice(k,1); else h.push(r);
    await saveSettings(); render();
  },
  toggleSetting: async function(k){ state.settings[k] = !state.settings[k]; await saveSettings(); render(); },
  refreshApp: async function(){
    try{
      if('serviceWorker' in navigator){ var regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(function(r){ return r.unregister(); })); }
      if(window.caches){ var keys = await caches.keys(); await Promise.all(keys.filter(function(k){ return k.indexOf('braindump-')===0; }).map(function(k){ return caches.delete(k); })); }
    }catch(e){}
    location.reload();
  }
};

/* ---------- start-up ---------- */
(async function boot(){
  render();
  try{ var s = await kvGet('settings'); if(s) for(var k in s) state.settings[k] = s[k]; }catch(e){}
  try{ state.me = await kvGet('auth'); }catch(e){}
  if(state.me){
    try{
      var cache = await kvGet('cache');
      if(cache){ state.people = cache.people||[]; state.chores = cache.chores||[]; state.completions = cache.completions||[];
        state.comments = cache.comments||[]; state.attachments = cache.attachments||[]; state.lastSync = cache.lastSync||null; state.version = cache.version==null?null:cache.version; }
      state.thumbs = (await kvGet('thumbs')) || {};
      state.vapidKey = await kvGet('vapid');
    }catch(e){}
    if(!state.people.length) state.people = [{id:state.me.id, name:state.me.name, colour:state.me.colour}];
    state.queue = await qAll().catch(function(){ return []; });
    state.screen = 'home';
    /* opened from a notification about a chore */
    var m = location.hash.match(/chore=([0-9a-f-]{36})/); if(m && chore(m[1])){ state.detailId = m[1]; state.screen = 'detail'; }
  } else state.screen = 'login';
  render();
  if(state.me){ syncNow(true); refreshPushState().then(safeRender); }

  window.addEventListener('online', function(){ state.online = true; syncNow(); });
  window.addEventListener('offline', function(){ state.online = false; safeRender(); });
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible'){ syncNow(); } });
  setInterval(function(){ if(document.visibilityState==='visible') syncNow(); }, SYNC_EVERY_MS);
  /* redraw once a minute so "Today", "Overdue" and late times stay right */
  setInterval(function(){ if(state.me) safeRender(); }, 60000);

  if('serviceWorker' in navigator && !window.__NO_SW){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
})();

})();
</script>
